<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorized Pet Brands - PawHaven BD</title>
  <meta name="description" content="Shop trusted pet brands like Royal Canin, Reflex, Me-O, Drools, SmartHeart, and Versele-Laga in Bangladesh.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Placeholder -->
  <header id="site-header"></header>

  <!-- Breadcrumbs & Header -->
  <div class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <nav class="flex items-center gap-2 text-xs text-slate-500 mb-2">
        <a href="index.html" class="hover:text-teal-600 transition">Home</a>
        <span>/</span>
        <span class="text-slate-800 font-bold">Brands</span>
      </nav>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Featured Pet Brands</h1>
          <p class="text-xs text-slate-500 mt-1">We guarantee 100% genuine products sourced directly from authorized importers.</p>
        </div>
        <div class="w-full sm:w-64">
          <input 
            type="text" 
            id="brand-search-input" 
            placeholder="Search brands..." 
            class="w-full px-4 py-2 rounded-xl border border-slate-200 text-xs text-slate-800 focus:outline-none focus:border-teal-500 bg-white"
          >
        </div>
      </div>
    </div>
  </div>

  <!-- Brands Grid -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div id="brands-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Populated dynamically via API -->
      <div class="col-span-full py-16 text-center text-slate-400">Loading brands...</div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <footer id="site-footer"></footer>

  <!-- Scripts -->
  <script src="components/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/search.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("brands-grid");
      const searchInput = document.getElementById("brand-search-input");
      let allBrands = [];

      try {
        const res = await window.api.getBrands();
        if (res.success && res.data && res.data.length > 0) {
          allBrands = res.data;
          renderBrands(allBrands);
        } else {
          container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">No brands found.</div>`;
        }
      } catch (e) {
        container.innerHTML = `<div class="col-span-full py-12 text-center text-red-500">Failed to load brands.</div>`;
      }

      function renderBrands(list) {
        if (list.length === 0) {
          container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">No brands match your search.</div>`;
          return;
        }

        container.innerHTML = list.map(b => `
          <div class="bg-white rounded-2xl border border-slate-200/80 p-6 flex flex-col justify-between hover:shadow-md hover:border-teal-500/40 transition group shadow-sm">
            <div>
              <div class="w-14 h-14 rounded-2xl bg-teal-50 text-teal-700 flex items-center justify-center font-black text-xl mb-4 group-hover:scale-105 transition-transform">
                ${b.name.charAt(0)}
              </div>
              <h3 class="font-extrabold text-slate-900 text-base group-hover:text-teal-600 transition mb-1">${b.name}</h3>
              <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-4">
                ${b.description || 'Global manufacturer of premium veterinary and daily maintenance pet diets.'}
              </p>
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
              <span class="text-[11px] font-semibold text-slate-400">Authorized Import</span>
              <a href="shop.html?brand=${b.slug}" class="text-xs font-bold text-teal-600 hover:text-teal-800 transition">
                Shop Brand →
              </a>
            </div>
          </div>
        `).join("");
      }

      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          const q = e.target.value.toLowerCase().trim();
          const filtered = allBrands.filter(b => b.name.toLowerCase().includes(q) || (b.description && b.description.toLowerCase().includes(q)));
          renderBrands(filtered);
        });
      }
    });
  </script>
</body>
</html>
