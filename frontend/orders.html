<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Shipments - PawHaven BD</title>
  <meta name="description" content="View your order history, delivery status, and tracking information at PawHaven BD.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Placeholder -->
  <header id="site-header"></header>

  <!-- Breadcrumbs & Header -->
  <div class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <nav class="flex items-center gap-2 text-xs text-slate-500 mb-2">
        <a href="index.html" class="hover:text-teal-600 transition">Home</a>
        <span>/</span>
        <a href="account.html" class="hover:text-teal-600 transition">Account</a>
        <span>/</span>
        <span class="text-slate-800 font-bold">Orders</span>
      </nav>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">My Orders & Purchases</h1>
    </div>
  </div>

  <!-- Orders Content -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-8 shadow-sm">
      
      <div id="orders-list-container">
        <div class="py-16 text-center">
          <div class="w-8 h-8 border-4 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
          <p class="text-sm text-slate-500">Loading your order history...</p>
        </div>
      </div>

      <!-- Pagination for orders -->
      <div id="orders-pagination" class="mt-6 flex justify-center"></div>

    </div>
  </main>

  <!-- Footer Placeholder -->
  <footer id="site-footer"></footer>

  <!-- Scripts -->
  <script src="components/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/search.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthManager || !window.AuthManager.isAuthenticated()) {
        window.location.href = `login.html?redirect=orders.html`;
        return;
      }

      const container = document.getElementById("orders-list-container");

      async function loadOrders(page = 1) {
        try {
          const res = await window.api.getMyOrders({ pageNumber: page, pageSize: 10 });
          if (!res.success || !res.data || res.data.items.length === 0) {
            container.innerHTML = `
              <div class="py-12 text-center">
                <div class="w-16 h-16 bg-teal-50 rounded-full flex items-center justify-center mx-auto mb-4 text-teal-600">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-1">No Orders Found</h3>
                <p class="text-xs text-slate-500 mb-6 max-w-sm mx-auto">You have not placed any orders yet. Discover our catalog of pet foods, treats, and care products!</p>
                <a href="shop.html" class="inline-block px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs transition">
                  Start Shopping
                </a>
              </div>
            `;
            return;
          }

          const orders = res.data.items;
          container.innerHTML = `
            <div class="divide-y divide-slate-100">
              ${orders.map(o => {
                let badgeClass = "bg-slate-100 text-slate-700";
                if (o.orderStatus?.toLowerCase() === "delivered") badgeClass = "bg-emerald-50 text-emerald-700 border border-emerald-200";
                else if (o.orderStatus?.toLowerCase() === "shipped") badgeClass = "bg-blue-50 text-blue-700 border border-blue-200";
                else if (o.orderStatus?.toLowerCase() === "cancelled") badgeClass = "bg-red-50 text-red-700 border border-red-200";
                else badgeClass = "bg-amber-50 text-amber-700 border border-amber-200";

                return `
                  <div class="py-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="space-y-1.5">
                      <div class="flex items-center gap-3">
                        <span class="font-extrabold text-slate-900 text-base">#${o.orderNumber}</span>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${badgeClass}">
                          ${o.orderStatus || 'Pending'}
                        </span>
                      </div>
                      <p class="text-xs text-slate-400">
                        Date: ${new Date(o.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}
                        • Items: ${o.items?.length || 1}
                        • Payment: <span class="capitalize font-semibold text-slate-600">${o.paymentMethod || 'COD'}</span>
                      </p>
                      <p class="text-xs text-slate-500">
                        Destination: ${o.shippingArea || ''}, ${o.shippingDistrict || 'Dhaka'}
                      </p>
                    </div>

                    <div class="flex items-center justify-between md:justify-end gap-6 pt-2 md:pt-0 border-t md:border-0 border-slate-100">
                      <div class="text-left md:text-right">
                        <span class="text-xs text-slate-400 block">Total Amount</span>
                        <span class="text-lg font-black text-slate-900">${window.formatPrice(o.totalAmount)}</span>
                      </div>

                      <a href="order-details.html?id=${o.id}" class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-teal-600 text-white font-bold text-xs transition shadow-sm">
                        View Details →
                      </a>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        } catch (err) {
          container.innerHTML = `<div class="py-8 text-center text-red-500 text-xs">Error loading orders.</div>`;
        }
      }

      loadOrders(1);
    });
  </script>
</body>
</html>
