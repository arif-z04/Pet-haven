<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In to Your Account - PawHaven BD</title>
  <meta name="description" content="Sign in to your PawHaven BD account to manage orders, track shipments, and view personalized pet nutritional advice.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Placeholder -->
  <header id="site-header"></header>

  <!-- Auth Main Area -->
  <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-lg">
      
      <!-- Brand & Header -->
      <div class="text-center">
        <div class="w-12 h-12 bg-teal-600 rounded-2xl mx-auto flex items-center justify-center text-white mb-3 shadow-md shadow-teal-500/20">
          <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-2-9c.83 0 1.5-.67 1.5-1.5S10.83 8 10 8s-1.5.67-1.5 1.5S9.17 11 10 11zm4 0c.83 0 1.5-.67 1.5-1.5S14.83 8 14 8s-1.5.67-1.5 1.5.67 1.5 1.5 1.5zm-2 5.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
          </svg>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h2>
        <p class="text-xs text-slate-500 mt-1">Sign in to access your orders and pet care profiles</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            required 
            placeholder="e.g. customer@pawhaven.bd"
            class="w-full p-3 rounded-xl border border-slate-200 text-xs font-medium text-slate-900 focus:outline-none focus:border-teal-500 transition"
          >
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="login-password" class="block text-xs font-bold text-slate-700">Password</label>
            <a href="contact.html" class="text-[11px] font-semibold text-teal-600 hover:underline">Forgot password?</a>
          </div>
          <input 
            type="password" 
            id="login-password" 
            required 
            placeholder="••••••••"
            class="w-full p-3 rounded-xl border border-slate-200 text-xs font-medium text-slate-900 focus:outline-none focus:border-teal-500 transition"
          >
        </div>

        <button 
          type="submit" 
          id="login-submit-btn" 
          class="w-full py-3.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-sm transition shadow-md shadow-teal-600/20 flex items-center justify-center gap-2"
        >
          <span>Sign In</span>
        </button>
      </form>

      <!-- Quick Demo Credentials Fill -->
      <div class="pt-4 border-t border-slate-100">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider text-center mb-2.5">Quick Demo Fill</p>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="fillDemo('customer@pawhaven.bd', 'Customer123!')" class="p-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-teal-50 hover:border-teal-300 text-[11px] font-bold text-slate-700 text-center transition">
            Customer
          </button>
          <button type="button" onclick="fillDemo('staff@pawhaven.bd', 'Staff123!')" class="p-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-teal-50 hover:border-teal-300 text-[11px] font-bold text-slate-700 text-center transition">
            Staff
          </button>
          <button type="button" onclick="fillDemo('admin@pawhaven.bd', 'Admin123!')" class="p-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-teal-50 hover:border-teal-300 text-[11px] font-bold text-slate-700 text-center transition">
            Admin
          </button>
        </div>
      </div>

      <!-- Register Link -->
      <div class="text-center text-xs text-slate-500">
        Don't have an account yet? 
        <a href="register.html" class="font-extrabold text-teal-600 hover:underline">Create an account</a>
      </div>

    </div>
  </main>

  <!-- Footer Placeholder -->
  <footer id="site-footer"></footer>

  <!-- Scripts -->
  <script src="components/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/search.js"></script>

  <script>
    function fillDemo(email, pass) {
      document.getElementById("login-email").value = email;
      document.getElementById("login-password").value = pass;
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const btn = document.getElementById("login-submit-btn");

      btn.disabled = true;
      btn.innerHTML = `<span>Signing In...</span>`;

      try {
        const res = await window.api.login(email, password);
        if (res.success && res.data) {
          window.AuthManager.saveSession(res.data);
          window.showToast("Signed in successfully! Welcome back.", "success");
          
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get("redirect") || "account.html";
          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        } else {
          window.showToast(res.message || "Invalid email or password.", "error");
          btn.disabled = false;
          btn.innerHTML = `<span>Sign In</span>`;
        }
      } catch (err) {
        window.showToast("Connection failed. Please ensure the backend is running.", "error");
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span>`;
      }
    });
  </script>
</body>
</html>
