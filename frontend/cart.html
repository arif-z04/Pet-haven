<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - PawHaven BD</title>
  <meta name="description" content="View items in your cart, calculate Dhaka and nationwide delivery fees, apply promotional coupons, and proceed to checkout.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Placeholder -->
  <header id="site-header"></header>

  <!-- Breadcrumbs & Header -->
  <div class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <nav class="flex items-center gap-2 text-xs text-slate-500 mb-2">
        <a href="index.html" class="hover:text-teal-600 transition">Home</a>
        <span>/</span>
        <span class="text-slate-800 font-bold">Shopping Cart</span>
      </nav>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Your Shopping Cart</h1>
    </div>
  </div>

  <!-- Cart Content Area -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- Cart Items List (8 cols) -->
      <section class="lg:col-span-8 space-y-4">
        <div id="cart-items-container">
          <!-- Populated dynamically by cart.js -->
        </div>

        <div class="pt-2 flex items-center justify-between">
          <a href="shop.html" class="inline-flex items-center gap-2 text-xs font-bold text-teal-600 hover:text-teal-800 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            <span>Continue Shopping</span>
          </a>
        </div>
      </section>

      <!-- Order Summary Card (4 cols) -->
      <aside class="lg:col-span-4 bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm sticky top-24 space-y-6">
        <h2 class="text-lg font-extrabold text-slate-900 pb-4 border-b border-slate-100">Order Summary</h2>

        <!-- Shipping Destination Selector -->
        <div>
          <label for="cart-delivery-region" class="block text-xs font-bold text-slate-700 mb-1.5">Shipping Destination</label>
          <select id="cart-delivery-region" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-800 bg-white focus:outline-none focus:border-teal-500">
            <option value="inside" selected>Inside Dhaka (Standard 24-48h) • ৳ 80</option>
            <option value="outside">Outside Dhaka (All 64 Districts) • ৳ 150</option>
          </select>
          <p class="text-[11px] text-slate-400 mt-1">Free delivery inside Dhaka on orders over ৳ 1,500.</p>
        </div>

        <!-- Coupon Code Input -->
        <div class="pt-4 border-t border-slate-100">
          <label for="coupon-code-input" class="block text-xs font-bold text-slate-700 mb-1.5">Have a Promo Coupon?</label>
          <div class="flex items-center gap-2">
            <input 
              type="text" 
              id="coupon-code-input" 
              placeholder="e.g. PAW10 or FREESHIP80" 
              class="flex-1 uppercase font-bold text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-teal-500"
            />
            <button 
              id="apply-coupon-btn" 
              type="button" 
              class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-teal-600 text-white font-bold text-xs transition shrink-0"
            >
              Apply
            </button>
          </div>
          <div id="coupon-status-msg" class="mt-2 min-h-[16px]"></div>
        </div>

        <!-- Price Totals Breakdown -->
        <div class="pt-4 border-t border-slate-100 space-y-2.5 text-sm">
          <div class="flex items-center justify-between text-slate-600">
            <span>Subtotal</span>
            <span id="cart-subtotal" class="font-bold text-slate-800">৳ 0</span>
          </div>

          <div class="flex items-center justify-between text-slate-600">
            <span>Coupon Savings</span>
            <span id="cart-discount" class="font-bold text-emerald-600">-৳ 0</span>
          </div>

          <div class="flex items-center justify-between text-slate-600">
            <span>Estimated Shipping</span>
            <span id="cart-delivery" class="font-bold text-slate-800">৳ 80</span>
          </div>

          <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-base font-black text-slate-900">
            <span>Estimated Total</span>
            <span id="cart-grand-total" class="text-xl text-teal-700">৳ 0</span>
          </div>
        </div>

        <!-- Proceed to Checkout Button -->
        <div class="pt-2">
          <a href="checkout.html" class="w-full block text-center py-3.5 px-6 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-sm transition shadow-lg shadow-teal-600/20">
            Proceed to Checkout
          </a>
        </div>

        <!-- Trust Badges Under Summary -->
        <div class="pt-4 border-t border-slate-100 grid grid-cols-2 gap-2 text-[11px] text-slate-500">
          <div class="flex items-center gap-1.5">
            <span class="text-emerald-500">✓</span>
            <span>Cash on Delivery</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-emerald-500">✓</span>
            <span>7 Days Return</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-emerald-500">✓</span>
            <span>Sealed Packaging</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-emerald-500">✓</span>
            <span>Authentic Imports</span>
          </div>
        </div>

      </aside>

    </div>
  </main>

  <!-- Footer Placeholder -->
  <footer id="site-footer"></footer>

  <!-- Scripts -->
  <script src="components/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/search.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
