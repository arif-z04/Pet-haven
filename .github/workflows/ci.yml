name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    name: Build & Verify .NET Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore backend/PetHaven.Api.csproj

    - name: Build Project
      run: dotnet build backend/PetHaven.Api.csproj --configuration Release --no-restore

  validate-scripts:
    name: Validate Scripts & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate Python Test Suite Syntax
      run: python3 -m py_compile tests/test_suite.py

    - name: Validate Database Setup Shell Script
      run: bash -n sql/setup_database.sh
